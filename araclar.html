    <style>
    .yorum-bolumu {
        margin-top: 15px;
        padding: 15px;
        background: #f5f7fa;
        border-radius: 10px;
        cursor: default;
    }

    .yorum-bolumu h4 {
        margin-top: 0;
        color: #222;
    }

    .yorum-listesi {
        margin-bottom: 15px;
    }

    .tek-yorum {
        padding: 10px;
        margin-bottom: 8px;
        background: white;
        border-radius: 7px;
        overflow-wrap: anywhere;
    }

    .tek-yorum strong {
        display: block;
        margin-bottom: 5px;
        color: #1769aa;
    }

    .yorum-formu input,
    .yorum-formu textarea {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
    }

    .yorum-formu textarea {
        min-height: 75px;
        resize: vertical;
    }

    .yorum-buton {
        padding: 10px 15px;
        background: #1769aa;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .yorum-buton:hover {
        background: #104d80;
    }

    .yorum-mesaji {
        font-size: 14px;
        margin-bottom: 0;
    }
</style>

        };
    })
];
function tumAraclariGetir() {
    return JSON.parse(localStorage.getItem("araclar")) || [];
}

function ornekAraclariKaydet() {
    if (localStorage.getItem("ornekAraclarHazir")) {
        return;
    }

    const kayitliAraclar =
        JSON.parse(localStorage.getItem("araclar")) || [];

    const yeniOrnekler = ornekAraclar.map((arac, index) => ({
        ...arac,
        id: "ornek-" + index,
        ornek: true
    }));

    localStorage.setItem(
        "araclar",
        JSON.stringify([...yeniOrnekler, ...kayitliAraclar])
    );

    localStorage.setItem("ornekAraclarHazir", "true");
}
function filtreSecenekleriniDoldur() {
    const araclar = tumAraclariGetir();

    const markaSecimi = document.getElementById("markaFiltre");
    const yilSecimi = document.getElementById("yilFiltre");

    const seciliMarka = markaSecimi.value;
    const seciliYil = yilSecimi.value;

    const markalar = [...new Set(
        araclar.map(arac => arac.marka).filter(Boolean)
    )].sort((a, b) => a.localeCompare(b, "tr"));

    const yillar = [...new Set(
        araclar.map(arac => String(arac.yil)).filter(Boolean)
    )].sort((a, b) => Number(b) - Number(a));

    markaSecimi.replaceChildren(new Option("Tüm Markalar", ""));

    markalar.forEach(marka => {
        markaSecimi.add(new Option(marka, marka));
    });

    yilSecimi.replaceChildren(new Option("Tüm Yıllar", ""));

    yillar.forEach(yil => {
        yilSecimi.add(new Option(yil, yil));
    });

    markaSecimi.value = markalar.includes(seciliMarka) ? seciliMarka : "";
    yilSecimi.value = yillar.includes(seciliYil) ? seciliYil : "";
}

function yorumlariGetir(aracId) {
    const yorumlar =
        JSON.parse(localStorage.getItem("aracYorumlari")) || {};

    return yorumlar[String(aracId)] || [];
}

function yorumBolumuOlustur(arac) {
    const bolum = document.createElement("div");
    bolum.className = "yorum-bolumu";

    // Kartın tıklanmasının detay sayfasına yönlendirmesini engelle
    bolum.addEventListener("click", function(event) {
        event.stopPropagation();
    });

    const baslik = document.createElement("h4");
    baslik.textContent = "💬 Müşteri Yorumları";

    const liste = document.createElement("div");
    liste.className = "yorum-listesi";

    function yorumlariGoster() {
        liste.replaceChildren();

        const yorumlar = yorumlariGetir(arac.id);

        if (yorumlar.length === 0) {
            const bos = document.createElement("p");
            bos.textContent = "Henüz yorum yapılmamış. İlk yorumu sen yaz!";
            liste.appendChild(bos);
            return;
        }

        yorumlar.forEach(function(yorum) {
            const yorumKart = document.createElement("div");
            yorumKart.className = "tek-yorum";

            const isim = document.createElement("strong");
            isim.textContent = yorum.ad;

            const metin = document.createElement("p");
            metin.textContent = yorum.metin;

            yorumKart.append(isim, metin);
            liste.appendChild(yorumKart);
        });
    }

    const form = document.createElement("form");
    form.className = "yorum-formu";

    const ad = document.createElement("input");
    ad.type = "text";
    ad.placeholder = "Adın";
    ad.maxLength = 50;
    ad.required = true;

    const metin = document.createElement("textarea");
    metin.placeholder = "Bu araç hakkındaki yorumunu yaz...";
    metin.maxLength = 1000;
    metin.required = true;

    const gonder = document.createElement("button");
    gonder.type = "submit";
    gonder.className = "yorum-buton";
    gonder.textContent = "Yorumu Gönder";

    const mesaj = document.createElement("p");
    mesaj.className = "yorum-mesaji";

    form.append(ad, metin, gonder, mesaj);

    form.addEventListener("submit", function(event) {
        event.preventDefault();
        event.stopPropagation();

        const yeniYorum = {
            ad: ad.value.trim(),
            metin: metin.value.trim(),
            tarih: new Date().toLocaleDateString("tr-TR")
        };

        if (!yeniYorum.ad || !yeniYorum.metin) {
            mesaj.textContent = "Lütfen adını ve yorumunu yaz.";
            return;
        }

        try {
            const tumYorumlar =
                JSON.parse(localStorage.getItem("aracYorumlari")) || {};

            const aracYorumlari = tumYorumlar[String(arac.id)] || [];

            aracYorumlari.push(yeniYorum);
            tumYorumlar[String(arac.id)] = aracYorumlari;

            localStorage.setItem(
                "aracYorumlari",
                JSON.stringify(tumYorumlar)
            );

            form.reset();
            mesaj.textContent = "Yorumun başarıyla kaydedildi!";
            yorumlariGoster();
        } catch (hata) {
            mesaj.textContent =
                "Yorum kaydedilemedi. Tarayıcı depolama alanını kontrol et.";
        }
    });

    yorumlariGoster();
    bolum.append(baslik, liste, form);

    return bolum;
}

function araclariGoster() {
    const liste = document.getElementById("aracListesi");
    const aranan = document.getElementById("arama")
        .value.toLocaleLowerCase("tr-TR").trim();

    const seciliMarka = document.getElementById("markaFiltre").value;
    const seciliYil = document.getElementById("yilFiltre").value;

    const minDeger = document.getElementById("minFiyat").value;
    const maxDeger = document.getElementById("maxFiyat").value;

    const minFiyat = minDeger === "" ? null : Number(minDeger);
    const maxFiyat = maxDeger === "" ? null : Number(maxDeger);

    liste.innerHTML = "";

    const sonuc = tumAraclariGetir().filter(arac => {
        const marka = (arac.marka || "").toLocaleLowerCase("tr-TR");
        const model = (arac.model || "").toLocaleLowerCase("tr-TR");
        const fiyat = Number(arac.fiyat || 0);
        const yil = String(arac.yil || "");

        return (
            (marka.includes(aranan) || model.includes(aranan)) &&
            (!seciliMarka || arac.marka === seciliMarka) &&
            (!seciliYil || yil === seciliYil) &&
            (minFiyat === null || fiyat >= minFiyat) &&
            (maxFiyat === null || fiyat <= maxFiyat)
        );
    });

    if (sonuc.length === 0) {
        liste.textContent = "Bu kriterlere uygun araç bulunamadı.";
        return;
    }

    sonuc.forEach(arac => {
        const satislar =
    JSON.parse(localStorage.getItem("satislar")) || [];

const satildi = satislar.some(function(satis) {
    return String(satis.aracId) === String(arac.id);
});
        const kart = document.createElement("div");
        kart.className = "arac-karti";
        kart.style.cursor = "pointer";

        kart.addEventListener("click", function() {
            window.location.href =
                "arac-detay.html?id=" + encodeURIComponent(arac.id);
        });

        const resim = document.createElement("img");
        resim.src = arac.resim ||
            "https://placehold.co/600x400?text=Arac+Fotografi";
        resim.alt = (arac.marka || "") + " " + (arac.model || "");

        const durum = document.createElement("p");
        durum.textContent = satildi ? "SATILDI" : "SATIŞTA";
        durum.style.display = "inline-block";
        durum.style.padding = "6px 12px";
        durum.style.borderRadius = "6px";
        durum.style.fontWeight = "bold";
        durum.style.color = satildi ? "#ffffff" : "#166534";
        durum.style.backgroundColor = satildi ? "#dc2626" : "#dcfce7";
        
        const bilgi = document.createElement("div");
        bilgi.className = "arac-bilgi";

        const baslik = document.createElement("h3");
        baslik.textContent = (arac.marka || "") + " " + (arac.model || "");

        const yil = document.createElement("p");
        yil.textContent = "Model yılı: " + (arac.yil || "-");

        const km = document.createElement("p");
        km.textContent = "Kilometre: " +
            Number(arac.km || 0).toLocaleString("tr-TR") + " km";

        const fiyat = document.createElement("h4");
        fiyat.textContent =
            Number(arac.fiyat || 0).toLocaleString("tr-TR") + " TL";

        bilgi.append(baslik,durum, yil, km, fiyat);

      
            const silButonu = document.createElement("button");
            silButonu.textContent = "Aracı Sil";
            silButonu.className = "sil-buton";

            silButonu.addEventListener("click", function(event) {
                event.stopPropagation();

                if (confirm("Bu aracı silmek istediğine emin misin?")) {
                    const kayitliAraclar =
                        JSON.parse(localStorage.getItem("araclar")) || [];

                    const kalanAraclar = kayitliAraclar.filter(
                        a => a.id !== arac.id
                    );

                    localStorage.setItem(
                        "araclar",
                        JSON.stringify(kalanAraclar)
                    );

                    ornekAraclariKaydet();
                    filtreSecenekleriniDoldur();
                    araclariGoster();
                }
            });

            bilgi.appendChild(silButonu);
        

kart.append(resim, bilgi);
liste.appendChild(kart);
    });
}


document.getElementById("arama").addEventListener("input", araclariGoster);
document.getElementById("markaFiltre").addEventListener("change", araclariGoster);
document.getElementById("yilFiltre").addEventListener("change", araclariGoster);
document.getElementById("minFiyat").addEventListener("input", araclariGoster);
document.getElementById("maxFiyat").addEventListener("input", araclariGoster);

document.getElementById("filtreSifirla").addEventListener("click", function() {
    document.getElementById("arama").value = "";
    document.getElementById("markaFiltre").value = "";
    document.getElementById("yilFiltre").value = "";
    document.getElementById("minFiyat").value = "";
    document.getElementById("maxFiyat").value = "";

    araclariGoster();
});

ornekAraclariKaydet();
filtreSecenekleriniDoldur();
araclariGoster();
    </script>
